name: Build Coexist DiPlay APK

on:
  workflow_dispatch: # 支持手动触发打包
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取当前代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 环境严格指定为 JDK 11（适配 DiPlay 官方构建环境）
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      # 3. 赋予 gradlew 执行权限
      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      # 4. 动态注入 Gradle Init 脚本修改包名后缀（彻底避免签名冲突，实现与原版共存）
      - name: Inject Coexistence Suffix into Android Config
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application")) {
                      project.android {
                          buildTypes {
                              debug {
                                  // 给包名追加 .beta 后缀，使车机判定为独立 App
                                  applicationIdSuffix ".beta"
                              }
                          }
                      }
                  }
              }
          }
          EOF

      # 5. 执行编译
      - name: Build Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace --no-daemon

      # 6. 上传编译产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Coexist-APK
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
